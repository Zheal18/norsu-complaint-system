<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 26px 30px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #0f172a;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #cbd5f5;
      font-size: 14px;
      transition: border 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    input[type="file"] {
      padding: 8px;
      height: auto;
    }

    .preview {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .preview img {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #2563eb;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.35);
    }

    button {
      margin-top: 10px;
      height: 46px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 20px rgba(37, 99, 235, 0.4);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
    }

    #message {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 500;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 24px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="register-container">
    <h2>Teacher Registration</h2>

    <form id="registerForm" enctype="multipart/form-data">
      <label>Full Name</label>
      <input type="text" name="name" required>

      <label>Username</label>
      <input type="text" name="username" required>

      <label>Password</label>
      <input type="password" name="password" required>

      <label>Email</label>
      <input type="email" name="email">

      <label>Classroom</label>
      <input type="text" name="classroom" required>

      <label>Profile Picture (optional)</label>
      <input type="file" id="profile_pic" name="profile_pic" accept="image/*">

      <div class="preview" id="preview"></div>

      <button type="submit">Create Account</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const preview = document.getElementById("preview");
    const message = document.getElementById("message");
    const profileInput = document.getElementById("profile_pic");

    profileInput.addEventListener("change", () => {
      const file = profileInput.files[0];
      if (!file) {
        preview.innerHTML = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        preview.innerHTML = `<img src="${reader.result}" alt="Preview">`;
      };
      reader.readAsDataURL(file);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(form);

      try {
        const res = await fetch("http://localhost:5000/api/teacher/register", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          message.textContent = "❌ " + (data.error || "Registration failed");
          message.className = "error";
          return;
        }

        message.textContent = "✅ Registration successful!";
        message.className = "success";

        if (data.profileImage) {
          preview.innerHTML = `<img src="${data.profileImage}" alt="Profile Picture">`;
        }

        setTimeout(() => {
          form.reset();
          window.location.href = "index.html";
        }, 2000);

      } catch (err) {
        console.error(err);
        message.textContent = "❌ Server error";
        message.className = "error";
      }
    });
  </script>
</body>
</html>
